services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./output:/usr/share/nginx/html
    depends_on:
      disk:
        condition: service_healthy

  db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: secret

  disk:
    build: .
    environment:
      THRESHOLD: ${THRESHOLD}
    volumes:
      - ./output:/output
    command: sh -c "/disk_check > /output/index.html && tail -f /dev/null"
    healthcheck:
      test: ["CMD", "test", "-f", "./output/index.html"]
      interval: 10s
      timeout: 5s
      retries: 3
  redis:
    image: redis:alpine
    restart: unless-stopped
